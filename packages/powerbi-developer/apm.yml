name: powerbi-developer
version: 0.3.0
description: Power BI report and semantic-model development profile for Claude Code and OpenCode.
license: MIT
includes: auto

targets:
  - claude
  - opencode

dependencies:
  apm:
    # Microsoft's focused plugin: report planning, design, authoring,
    # management, and semantic-model authoring. It excludes the broader
    # Fabric developer skill bundle.
    - git: https://github.com/microsoft/skills-for-fabric.git
      path: plugins/powerbi-authoring
      ref: main
  mcp:
    # Local read/write semantic-model development for PBIP, Desktop, and
    # Fabric models. Profile instructions govern approval for mutations.
    - name: powerbi-modeling-mcp
      registry: false
      transport: stdio
      command: cmd.exe
      args:
        - /d
        - /s
        - /c
        - npx.cmd
        - -y
        - "@microsoft/powerbi-modeling-mcp@latest"
        - --start
    # Hosted, read-oriented access to published semantic models and report
    # metadata. The MCP client performs Microsoft Entra authentication.
    - name: powerbi-remote
      registry: false
      transport: http
      url: https://api.fabric.microsoft.com/v1/mcp/powerbi
